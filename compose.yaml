services:
  postgresql:
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - ./datasets:/datasets:Z
      - ./scripts:/scripts:Z
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: "123123"
    ports:
      - "0.0.0.0:5432:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
